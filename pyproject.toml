[project]
name = "snp-alloc"
version = "0.1.0"
description = "SNP Heuristic: allocation of scarce supply between requests"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.14.3",
]

[dependency-groups]
dev = [
    "hypothesis>=6.168.5",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snp_alloc"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
snp-alloc = "snp_alloc.main:main"
